  &lt;style&gt;
    :root {
      --canvas: #DBEFED;
      --surface: #EDF7F8;
      --surface-alt: #E9F8F5;

      --muted: #587476;

      --border: #C3D2D3;

      background: var(--canvas);

    }

      padding: 28px clamp(18px, 4vw, 64px) 36px;
      position: relative;
      overflow-x: hidden;
    }
    .page::before {
      content: &quot;&quot;;
      position: absolute;
      width: 230px;
      height: 230px;
      right: -80px;
      top: 88px;
      border-radius: 50%;
      background: rgba(113, 212, 209, .22);
      pointer-events: none;
    }
    .wrap { width: min(1380px, 100%); margin: 0 auto; position: relative; z-index: 1; }
    .header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 6px; color: var(--positive); font-weight: 800; letter-spacing: .12em; font-size: 13px; }
    h1 { margin: 0; font-size: clamp(28px, 3.5vw, 46px); line-height: 1.12; letter-spacing: -.03em; }
    .subtitle { margin: 10px 0 0; color: var(--muted); font-size: clamp(14px, 1.5vw, 18px); }
    .reset {
      min-height: 46px; padding: 0 20px; border: 1px solid var(--primary-deep); border-radius: 8px;
      background: var(--primary); color: #000; font-weight: 800; box-shadow: 0 5px 0 rgba(98,178,177,.35);
      transition: transform .16s ease, filter .16s ease;
      white-space: nowrap;
    }
    .reset:hover { filter: brightness(.98); transform: translateY(-1px); }
    .reset:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(98,178,177,.35); }
    .grid { display: grid; grid-template-columns: minmax(310px, .85fr) minmax(540px, 1.55fr); gap: 20px; align-items: stretch; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
    .controls { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
    .card-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 2px; }
    .card-title h2 { margin: 0; font-size: 20px; }
    .tag { padding: 5px 9px; border-radius: 999px; font-size: 12px; color: var(--positive); background: var(--highlight); font-weight: 800; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field label { display: block; font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .input-wrap { display: flex; align-items: center; border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 0 10px; min-height: 44px; }
    .input-wrap:focus-within { outline: 3px solid rgba(113,212,209,.28); border-color: var(--primary-deep); }
    .input-wrap input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-weight: 800; font-size: 17px; }
    .unit { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .slider-block { background: var(--surface-alt); border: 1px solid var(--border); padding: 16px; border-radius: 10px; }
    .slider-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .slider-head strong { font-size: 15px; }
    .current-readout { color: var(--positive); font-weight: 900; font-size: 22px; }
    input[type=&quot;range&quot;] { width: 100%; accent-color: var(--primary-deep); margin: 16px 0 8px; height: 30px; }
    .range-ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .formula { min-height: 34px; display: flex; align-items: center; color: var(--ink); font-size: 17px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0; }
    .main-stage { padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    .stage-head { display: flex; justify-content: space-between; gap: 15px; align-items: flex-start; }
    .stage-head h2 { margin: 0; font-size: 20px; }
    .stage-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .status { border: 2px solid var(--positive); color: var(--positive); background: rgba(44,103,81,.08); border-radius: 10px; padding: 10px 14px; min-width: 150px; text-align: center; font-weight: 900; transition: color .2s ease, background .2s ease, border-color .2s ease; }
    .status .status-label { display: block; font-size: 12px; letter-spacing: .08em; margin-bottom: 2px; }
    .status .status-main { font-size: 19px; }
    .status.out { border-color: var(--attention); color: var(--attention); background: rgba(214,106,88,.11); }
    .number-line-wrap { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 12px; padding: 18px 14px 12px; }
    .number-line-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .number-line-title strong { font-size: 15px; }
    .legend { display: flex; gap: 15px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .legend-item { display: inline-flex; gap: 6px; align-items: center; }
    .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--primary-deep); }
    .dot.safe { background: var(--primary); border: 1px solid var(--primary-deep); border-radius: 3px; width: 14px; }
    .dot.bad { background: var(--attention); }

    .safe-band { position: absolute; top: 68px; height: 24px; border-radius: 6px; background: rgba(113,212,209,.65); border: 1px solid var(--primary-deep); transition: left .2s ease, width .2s ease; }
    .edge { position: absolute; top: 54px; height: 52px; width: 2px; background: var(--positive); transition: left .2s ease; }
    .edge-label { position: absolute; top: 18px; transform: translateX(-50%); text-align: center; font-size: 12px; color: var(--positive); white-space: nowrap; font-weight: 800; }
    .edge-label .math { margin-top: 1px; }

    .current-marker.out { background: var(--attention); box-shadow: 0 0 0 2px var(--attention); }
    .current-label { position: absolute; top: 125px; transform: translateX(-50%); color: var(--positive); font-weight: 900; font-size: 13px; white-space: nowrap; transition: left .2s ease, color .2s ease; }
    .current-label.out { color: var(--attention); }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .summary { border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 14px; min-width: 0; }
    .summary .label { color: var(--muted); font-size: 12px; font-weight: 700; margin-bottom: 6px; }
    .summary .value { font-size: 18px; font-weight: 900; min-height: 32px; display: flex; align-items: center; }
    .callout { border-left: 5px solid var(--primary-deep); padding: 12px 14px; background: var(--highlight); color: var(--ink); border-radius: 0 8px 8px 0; }
    .callout strong { color: var(--positive); }
    .callout.out { border-left-color: var(--attention); background: rgba(214,106,88,.12); }
    .callout.out strong { color: var(--attention); }
    .footer-note { margin: 16px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      .controls { order: 2; }
      .main-stage { order: 1; }
    }
    @media (max-width: 620px) {
      .page { padding: 18px 12px 28px; }
      .header { align-items: flex-start; flex-direction: column; }
      .reset { width: 100%; }
      .field-grid, .summary-grid { grid-template-columns: 1fr; }
      .main-stage, .controls { padding: 16px; }
      .stage-head { flex-direction: column; }
      .status { width: 100%; }
      .axis { margin: 0 11px; }
      .edge-label { font-size: 10px; }
      .tick-label { font-size: 10px; }
      .number-line-title { align-items: flex-start; flex-direction: column; }
    }

            &lt;div class=&quot;summary&quot;&gt;&lt;div class=&quot;label&quot;&gt;合格区间&lt;/div&gt;&lt;div class=&quot;value&quot; id=&quot;qualifiedValue&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;script&gt;
    const defaults = { target: 100, tolerance: 2, current: 100 };
    const $ = (id) =&gt; document.getElementById(id);
    const els = {
      target: $('targetInput'), tolerance: $('tolInput'), slider: $('currentSlider'), reset: $('resetBtn'),
      currentReadout: $('currentReadout'), sliderMin: $('sliderMin'), sliderMax: $('sliderMax'), rangeFormula: $('rangeFormula'),
      statusBox: $('statusBox'), statusMain: $('statusMain'), safeBand: $('safeBand'), leftEdge: $('leftEdge'), rightEdge: $('rightEdge'),
      leftEdgeLabel: $('leftEdgeLabel'), rightEdgeLabel: $('rightEdgeLabel'), leftMath: $('leftMath'), rightMath: $('rightMath'),
      currentMarker: $('currentMarker'), currentLabel: $('currentLabel'), minTick: $('minTick'), targetTick: $('targetTick'), maxTick: $('maxTick'),
      minLabel: $('minLabel'), targetLabel: $('targetLabel'), maxLabel: $('maxLabel'), errorRangeValue: $('errorRangeValue'),
      deviationValue: $('deviationValue'), qualifiedValue: $('qualifiedValue'), callout: $('callout'), calloutLead: $('calloutLead'), calloutText: $('calloutText')
    };
    let state = { ...defaults };

    function clean(n) {
      const value = Number(n);
      if (!Number.isFinite(value)) return 0;
      return Math.round(value * 10) / 10;
    }
    function fmt(n) {
      const v = clean(n);
      return Number.isInteger(v) ? String(v) : v.toFixed(1).replace(/\.0$/, '');
    }
    function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }
    function getParams() {
      let target = clean(els.target.value);
      let tolerance = clean(els.tolerance.value);
      if (!(target &gt; 0)) target = defaults.target;
      if (!(tolerance &gt; 0)) tolerance = defaults.tolerance;
      return { target, tolerance, left: clean(target - tolerance), right: clean(target + tolerance) };
    }
    function sliderBounds(params) {
      const span = Math.max(params.tolerance * 3, 1);
      return { min: clean(params.target - span), max: clean(params.target + span) };
    }
    function setMath(el, tex) {
      el.textContent = tex;
    }
    async function prepareMathRoots() {
      await MathJax.startup.promise;
      const roots = [els.rangeFormula, els.leftMath, els.rightMath, els.errorRangeValue, els.deviationValue, els.qualifiedValue];
      roots.forEach((root) =&gt; MathJax.typesetClear([root]));
      return roots;
    }
    async function typesetMathRoots(roots) {
      const activeRoots = roots.filter((root) =&gt; root &amp;&amp; root.textContent.trim());
      if (activeRoots.length) await MathJax.typesetPromise(activeRoots);
    }
    function pct(value, min, max) {
      return ((value - min) / (max - min)) * 100;
    }
    async function render() {
      const mathRoots = await prepareMathRoots();
      const p = getParams();
      const bounds = sliderBounds(p);
      state.target = p.target;
      state.tolerance = p.tolerance;
      state.current = clamp(clean(els.slider.value), bounds.min, bounds.max);
      els.target.value = fmt(p.target);
      els.tolerance.value = fmt(p.tolerance);
      els.slider.min = fmt(bounds.min);
      els.slider.max = fmt(bounds.max);
      els.slider.step = '0.1';
      els.slider.value = fmt(state.current);
      els.sliderMin.textContent = fmt(bounds.min);
      els.sliderMax.textContent = fmt(bounds.max);
      els.currentReadout.textContent = `${fmt(state.current)} mm`;

      const isQualified = state.current &gt;= p.left - 1e-9 &amp;&amp; state.current &lt;= p.right + 1e-9;
      const deviation = clean(state.current - p.target);
      const axisMin = bounds.min;
      const axisMax = bounds.max;
      const leftPct = pct(p.left, axisMin, axisMax);
      const rightPct = pct(p.right, axisMin, axisMax);
      const currentPct = pct(state.current, axisMin, axisMax);
      const targetPct = pct(p.target, axisMin, axisMax);

      els.safeBand.style.left = `${leftPct}%`;
      els.safeBand.style.width = `${rightPct - leftPct}%`;
      els.leftEdge.style.left = `${leftPct}%`;
      els.rightEdge.style.left = `${rightPct}%`;
      els.leftEdgeLabel.style.left = `${leftPct}%`;
      els.rightEdgeLabel.style.left = `${rightPct}%`;
      els.currentMarker.style.left = `${currentPct}%`;
      els.currentLabel.style.left = `${currentPct}%`;
      els.currentLabel.textContent = `当前值 ${fmt(state.current)} mm`;
      els.minTick.style.left = '0%'; els.targetTick.style.left = `${targetPct}%`; els.maxTick.style.left = '100%';
      els.minLabel.style.left = '0%'; els.targetLabel.style.left = `${targetPct}%`; els.maxLabel.style.left = '100%';
      els.minLabel.textContent = fmt(axisMin); els.targetLabel.textContent = `标准值 ${fmt(p.target)}`; els.maxLabel.textContent = fmt(axisMax);

      setMath(els.rangeFormula, `\\(\\text{合格区间： } ${fmt(p.left)} \\le x \\le ${fmt(p.right)}\\text{ mm}\\)`);
      setMath(els.leftMath, `\\(${fmt(p.left)}\\)`);
      setMath(els.rightMath, `\\(${fmt(p.right)}\\)`);
      setMath(els.errorRangeValue, `\\(\\pm ${fmt(p.tolerance)}\\text{ mm}\\)`);
      setMath(els.deviationValue, `\\(${deviation &gt;= 0 ? '+' : ''}${fmt(deviation)}\\text{ mm}\\)`);
      setMath(els.qualifiedValue, `\\([${fmt(p.left)},\\ ${fmt(p.right)}]\\text{ mm}\\)`);

      els.statusMain.textContent = isQualified ? '合格' : '超出范围';
      els.statusBox.classList.toggle('out', !isQualified);
      els.currentMarker.classList.toggle('out', !isQualified);
      els.currentLabel.classList.toggle('out', !isQualified);
      els.callout.classList.toggle('out', !isQualified);
      els.calloutLead.textContent = isQualified ? '判定：' : '警示：';
      els.calloutText.textContent = isQualified
        ? `当前产品值落在 ${fmt(p.left)} mm 到 ${fmt(p.right)} mm 的合格区间内。`
        : `当前产品值已超出合格区间，距离最近边界约 ${fmt(Math.min(Math.abs(state.current - p.left), Math.abs(state.current - p.right)))} mm。`;

      window.__interactionState = {
        target: p.target, tolerance: p.tolerance, current: state.current, left: p.left, right: p.right,
        qualified: isQualified, status: isQualified ? 'qualified' : 'out-of-range', currentPct
      };
      await typesetMathRoots(mathRoots);
    }

    function syncFromParameter() {
      const p = getParams();
      const bounds = sliderBounds(p);
      state.current = p.target;
      els.slider.min = fmt(bounds.min);
      els.slider.max = fmt(bounds.max);
      els.slider.value = fmt(state.current);
      render();
    }
    els.slider.addEventListener('input', render);
    els.target.addEventListener('input', syncFromParameter);
    els.tolerance.addEventListener('input', syncFromParameter);
    els.reset.addEventListener('click', () =&gt; {
      els.target.value = defaults.target;
      els.tolerance.value = defaults.tolerance;
      const resetBounds = sliderBounds({ target: defaults.target, tolerance: defaults.tolerance });
      els.slider.min = fmt(resetBounds.min);
      els.slider.max = fmt(resetBounds.max);
      els.slider.value = fmt(defaults.current);
      state = { ...defaults };
      render();
    });
    window.addEventListener('resize', render);
    render();
  &lt;/script&gt;
